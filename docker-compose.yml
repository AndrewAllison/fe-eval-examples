name: frontend-aisdlc-reference

services:
  database:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: aisdlc
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisdlc"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
