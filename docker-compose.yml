name: frontend-aisdlc-reference

services:
  database:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: aisdlc
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisdlc"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
