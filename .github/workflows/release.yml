name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  container:
    name: Validate and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh creates the verified tag release.
      packages: write # build-push publishes the image to GHCR.
    env:
      GOOGLE_CLIENT_ID: ${{ github.run_id }}-ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ${{ github.sha }}
      GOOGLE_WORKSPACE_DOMAIN: example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-env.ts
      - run: pnpm verify
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          secret-files: |
            app_env=.env.local
          provenance: mode=max
          sbom: true
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
