name: Quality and evidence

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aisdlc
  BETTER_AUTH_SECRET: ${{ github.sha }}
  BETTER_AUTH_URL: https://localhost:3000
  GOOGLE_CLIENT_ID: 123456789-ci.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: ci-only-client-secret
  GOOGLE_WORKSPACE_DOMAIN: example.test
  LOG_LEVEL: info

jobs:
  quality:
    name: Deterministic quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: aisdlc
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aisdlc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm verify
      - name: Upload AI SDLC audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-audit
          path: .artifacts/ai-sdlc-audit
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage
          if-no-files-found: error

  browser-evidence:
    name: Browser journey evidence
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: aisdlc
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aisdlc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec agent-browser install --with-deps
      - name: Install video recorder
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm db:migrate
      - name: Capture browser evidence
        run: |
          pnpm dev > /tmp/frontend-aisdlc-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          curl --fail --insecure --retry 30 --retry-connrefused --retry-delay 2 https://localhost:3000/api/health
          pnpm evidence:capture
        env:
          EVIDENCE_RUN_ID: pr-${{ github.event.pull_request.number || github.run_number }}-${{ github.run_attempt }}
          EVIDENCE_PASSWORD: ${{ github.sha }}
      - name: Report server diagnostics
        if: failure()
        run: tail -200 /tmp/frontend-aisdlc-next.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: evidence/runs
          if-no-files-found: error
          retention-days: 30
