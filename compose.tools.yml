name: frontend-aisdlc-tools

services:
  actionlint:
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: [-color]

  zizmor:
    image: ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: [--pedantic, .]

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    working_dir: /repo
    volumes:
      - .:/repo:ro
